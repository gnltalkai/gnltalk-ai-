<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - GnlTalk AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <button class="btn-back" onclick="location.href='index.html'">←</button>
    <div class="content">
      <div class="name-box">GnlTalk AI</div>
      <p class="page-title">Créer un compte</p>

      <input type="text" class="input-field" placeholder="Nom d'utilisateur" id="username">
      <input type="email" class="input-field" placeholder="E-mail" id="email">
      <input type="password" class="input-field" placeholder="Mot de passe" id="password">

      <button class="btn-primary" onclick="alert('Inscription à venir - PHASE 8')">S'inscrire</button>

      <p class="link-secondary">Déjà un compte ? <a href="login.html">Se connecter</a></p>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>

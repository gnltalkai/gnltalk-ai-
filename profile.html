<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon profil - GnlTalk AI</title>
  <link rel="stylesheet" href="css/style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="profile-user-page">
    <p class="page-header">Mon profil</p>

    <div class="profile-user-content">
      <div class="logo-circle big" id="profileInitial"></div>
      <p class="profile-username" id="profileUsername">Utilisateur</p>
      <p class="profile-email" id="profileEmail"></p>
    </div>

    <p class="settings-section-title">Compte</p>
    <div class="settings-group">
      <div class="settings-item" id="editUsernameBtn">Modifier le nom d'utilisateur</div>
      <div class="settings-item" id="editPasswordBtn">Changer le mot de passe</div>
    </div>

    <p class="settings-section-title">Confidentialité & sécurité</p>
    <div class="settings-group">
      <div class="settings-item" onclick="location.href='privacy.html'">Confidentialité</div>
      <div class="settings-item settings-danger" onclick="location.href='privacy.html'">Supprimer mon compte</div>
    </div>

    <div class="settings-group">
      <div class="settings-item settings-danger" id="logoutBtn">Déconnexion</div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='history.html'">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </div>
    <div class="nav-item" onclick="location.href='premium.html'">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 3h12l4 6-10 12L2 9Z"/><path d="M11 3 8 9l4 12 4-12-3-6"/><path d="M2 9h20"/></svg>
    </div>
    <div class="nav-item active" onclick="location.href='profile.html'">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
